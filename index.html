// Silent previews load only while visible. Full playback is started by a click.
let previewObserver;
function pausePreviews(){document.querySelectorAll('video[data-preview]').forEach(v=>v.pause())}
function syncPreviews(){
  const blocked=document.hidden||!!document.querySelector('dialog[open]');
  document.querySelectorAll('video[data-preview]').forEach(v=>{
    if(blocked||v.dataset.visible!=='true'){v.pause();return}
    if(!v.getAttribute('src'))v.src=v.dataset.src;
    v.muted=true;v.defaultMuted=true;v.play().catch(()=>{});
  });
}
function setupPreviews(){
  previewObserver?.disconnect();
  const videos=document.querySelectorAll('video[data-preview]');
  if('IntersectionObserver' in window){
    previewObserver=new IntersectionObserver(entries=>{entries.forEach(({target,isIntersecting})=>target.dataset.visible=String(isIntersecting));syncPreviews()},{threshold:.15});
    videos.forEach(v=>previewObserver.observe(v));
  }else{videos.forEach(v=>v.dataset.visible='true');syncPreviews()}
}
function openMedia(m){
  if(!m)return;pausePreviews();
  const box=$('zoom-content');box.replaceChildren();
  const el=document.createElement(m.type==='video'?'video':'img');
  el.src=src(m.src);
  if(m.type==='video'){el.controls=true;el.playsInline=true;el.volume=.65;el.muted=false;el.preload='metadata';el.setAttribute('aria-label',loc(m.title))}
  else el.alt=loc(m.title);
  box.append(el);$('zoom').showModal();
  if(m.type==='video')el.play().catch(()=>{});
}
document.addEventListener('visibilitychange',syncPreviews);
document.querySelectorAll('dialog').forEach(d=>{
  new MutationObserver(syncPreviews).observe(d,{attributes:true,attributeFilter:['open']});
});
$('zoom').onclose=()=>{const v=$('zoom-content').querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load()}$('zoom-content').replaceChildren();syncPreviews()};
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&!e.altKey&&e.code==='KeyE'){
    if(e.repeat||e.target.isContentEditable||['INPUT','TEXTAREA'].includes(e.target.tagName)||document.querySelector('dialog[open]'))return;
    e.preventDefault();const show=!document.body.classList.contains('editor-access');
    document.body.classList.toggle('editor-access',show);if(!show)editing=false;render();
    notify(show?'Редактор доступен':'Редактор скрыт',show?'Editor available':'Editor hidden');
  }
});
const renderBeforeViewer=render;
render=function(){renderBeforeViewer();setupPreviews()};

const translationUpdates=[{"path":["slides","0","text"],"ru":"Визуал композиции через существующий мир Whisp. В основе — вечная борьба с собой, своими слабостями и страхами. Тьма - собственный разум в котором заточены люди с слабой психикой. Борьба, сопротивление - смысл существования. Висп пытается отыскать свое предназначение, знания и преодолеть то, что с каждым его появлением вне тьмы пытается разрушить. Его суть в страдании и в борьбе, прибывание вне борьбы попросту разрушает Виспа и наполняет его самыми злыми и ужасными помыслами.\n","en":"The composition is visualized through Whisp’s existing world. At its core is an endless struggle with oneself, one’s weaknesses and fears. Darkness is the mind itself, imprisoning those whose psyche is fragile. Struggle and resistance are the meaning of existence. Whisp seeks his purpose and knowledge, striving to overcome what threatens to destroy him each time he emerges from the darkness. His essence lies in suffering and struggle; an existence without struggle simply destroys Whisp and fills him with the most vicious and dreadful thoughts.\n","oldEn":"The composition’s visuals through Whisp’s existing world. An endless struggle with oneself, one’s weaknesses and fears."},{"path":["slides","0","notes"],"ru":"Я предлагаю совместить мой лор с треком Tyler и создать что-то между синиматиком и арт трейлером. \nМир в котором я вижу один из сюжетов: - Memories of our End. \nГлавный переход — от холодного спокойствия во тьму. Очередные страдания, которые стали основой смысла и без которых Висп не может существовать.\nСвет не каждому во благо - Висп обречен скитаться во тьме, в поисках собственного света. Его роль в виде защитника, но и Свет что он несет может оказаться разрушительным.","en":"I propose bringing my lore together with Tyler’s track to create something between a cinematic and an art trailer.\nThe world I envision for one of the storylines is Memories of Our End.\nThe central transition is from cold stillness into darkness. Suffering returns: it has become the foundation of meaning, and Whisp cannot exist without it.\nLight is not a blessing for everyone. Whisp is condemned to wander in darkness, searching for his own light. His role is that of a protector, yet the Light he carries can also be destructive.","oldEn":"I propose developing my existing lore and visual language. The central transition is from cold stillness into darkness. Light does not bring good to everyone: Whisp must bear his curse. The music is about five minutes long; its audio has not been added here."},{"path":["slides","1","text"],"ru":"Prologue и Inescapble Essence. Новая история располагается между ними - Tremor of happines.\n","en":"Prologue and Inescapable Essence. The new story takes place between them: Tremor of Happiness.\n","oldEn":"Prologue and Story 2 are the starting point. The new story takes place between them."},{"path":["slides","1","notes"],"ru":"\n","en":"\n","oldEn":"Show the existing animations: the world’s atmosphere, the character and events in the darkness. Story 2 uses the supplied file with the PREV suffix."},{"path":["slides","1","items","2","caption"],"ru":"Memories of Our End [Fun made teaser]","en":"Memories of Our End [Fan-made teaser]","oldEn":"New block"},{"path":["slides","6","text"],"ru":"Плавное атмосферное начало. Ландшафты разрушенного мира //Под музыкальный ритм и настроение. Погружение в локацию происходит ближе к развязке музыке - основной сценой является улица с окаменелыми людьми. Люди застывшие в различных позах отображающие ужас, страх, грусть, тоску, ненависть - и все те эмоции в которых можно застрять на всегда. ","en":"A slow, atmospheric opening. Landscapes of the ruined world follow the music’s rhythm and mood. As the music approaches its climax, we move deeper into the setting. The main scene is a street filled with petrified people. They are frozen in different poses expressing horror, fear, sadness, longing, hatred — all the emotions in which someone can remain trapped forever.","oldEn":"A slow, atmospheric opening. Landscapes of the ruined world, followed by motionless people. Whisp’s presence is restrained."},{"path":["slides","7","text"],"ru":"Врыв гитар и барабанов. Резкое и дерзкое переключение кадров сцен с окаменелыми лицами под музыку. ((Пока ищу на чем может быть обоснован переход во тьму. Для обычного перехода, Висп чаще сам себя уничтожает ибо тьма в его голове захватывает его разум. Однако тьма может прийти из вне и затянуть в густой водоворот грез - одна метафора на состояние мира, которое со всех сторон так и тянет упасть с головой во мрак)).","en":"Guitars and drums burst in. Abrupt, bold cuts between shots of petrified faces follow the music. ((I am still looking for what could motivate the transition into darkness. Usually, Whisp destroys himself because the darkness in his head takes over his mind. Yet darkness can also arrive from outside and pull him into a dense whirlpool of visions — a metaphor for a world that, from every direction, seems to lure us into plunging headfirst into the dark.))","oldEn":"Guitars and drums burst in. The faces come alive; Whisp is drawn into darkness."},{"path":["slides","8","text"],"ru":"Основная часть. Тизерная нарезка событий и сюжетов: борьба, падения, победы и поражения. Не имеющего последовательного повествования, это больше передача настроения, разных эмоций и кусков общего лора персонажа Висп. ","en":"The main section. A teaser montage of events and story fragments: struggle, falls, victories and defeats. There is no linear narrative; it is more about conveying a mood, different emotions and fragments of Whisp’s wider lore.","oldEn":"Main section. A teaser montage of events and story fragments: struggle, falls, victories and defeats."}];
