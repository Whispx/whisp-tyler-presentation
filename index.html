o Banana Pro)_2026-05-20_11-37-48.png"}},"user-e53e64af-f5da-4573-a4db-70c2b1fd231b":{"id":"user-e53e64af-f5da-4573-a4db-70c2b1fd231b","src":"media/user-e53e64af-f5da-4573-a4db-70c2b1fd231b-src.png","type":"image","filename":"WHISP_10013.png","title":{"ru":"WHISP_10013.png","en":"WHISP_10013.png"}},"user-fd759bb3-1dda-40ef-bb80-58321677e2ec":{"id":"user-fd759bb3-1dda-40ef-bb80-58321677e2ec","src":"media/user-fd759bb3-1dda-40ef-bb80-58321677e2ec-src.png","type":"image","filename":"whisplol_A_bleak_and_dramatic_Arctic_landscape_in_a_blizzard_a__780b462c-b7f1-453e-af97-40ddca4bd6e8.png","title":{"ru":"whisplol_A_bleak_and_dramatic_Arctic_landscape_in_a_blizzard_a__780b462c-b7f1-453e-af97-40ddca4bd6e8.png","en":"whisplol_A_bleak_and_dramatic_Arctic_landscape_in_a_blizzard_a__780b462c-b7f1-453e-af97-40ddca4bd6e8.png"}},"online-dark-stuff":{"id":"online-dark-stuff","type":"video","platform":"YouTube","externalUrl":"https://www.youtube.com/watch?v=ab3Rn-aDbDE","title":{"ru":"Most dark stuff what i make (i think)","en":"Most dark stuff what i make (i think)"},"filename":"YouTube"},"online-w8-for":{"id":"online-w8-for","type":"video","platform":"Instagram","externalUrl":"https://www.instagram.com/p/DQmHRG5Dc4K/","title":{"ru":"WHAT R U W8 FOR?","en":"WHAT R U W8 FOR?"},"filename":"Instagram"},"online-paranoia":{"id":"online-paranoia","type":"video","platform":"Instagram","externalUrl":"https://www.instagram.com/reel/DBcR0idtPKa/","title":{"ru":"All in one. Paranoia.","en":"All in one. Paranoia."},"filename":"Instagram"}},"slides":[{"id":"idea","section":"idea","title":{"ru":"Whisp × Tyler Bates","en":"Whisp × Tyler Bates"},"text":{"ru":"Визуал композиции через существующий мир Whisp. В основе — вечная борьба с собой, своими слабостями и страхами. Тьма - собственный разум в котором заточены люди с слабой психикой. Борьба, сопротивление - смысл существования. Висп пытается отыскать свое предназначение, знания и преодолеть то, что с каждым его появлением вне тьмы пытается разрушить. Его суть в страдании и в борьбе, прибывание вне борьбы попросту разрушает Виспа и наполняет его самыми злыми и ужасными помыслами.\n","en":"The composition is visualized through Whisp’s existing world. At its core is an endless struggle with oneself, one’s weaknesses and fears. Darkness is the mind itself, imprisoning those whose psyche is fragile. Struggle and resistance are the meaning of existence. Whisp seeks his purpose and knowledge, striving to overcome what threatens to destroy him each time he emerges from the darkness. His essence lies in suffering and struggle; an existence without struggle simply destroys Whisp and fills him with the most vicious and dreadful thoughts.\n"},"notes":{"ru":"Я предлагаю совместить мой лор с треком Tyler и создать что-то между синиматиком и арт трейлером. \nМир в котором я вижу один из сюжетов: - Memories of our End. \nГлавный переход — от холодного спокойствия во тьму. Очередные страдания, которые стали основой смысла и без которых Висп не может существовать.\nСвет не каждому во благо - Висп обречен скитаться во тьме, в поисках собственного света. Его роль в виде защитника, но и Свет что он несет может оказаться разрушительным.","en":"I propose bringing my lore together with Tyler’s track to create something between a cinematic and an art trailer.\nThe world I envision for one of the storylines is Memories of Our End.\nThe central transition is from cold stillness into darkness. Suffering returns: it has become the foundation of meaning, and Whisp cannot exist without it.\nLight is not a blessing for everyone. Whisp is condemned to wander in darkness, searching for his own light. His role is that of a protector, yet the Light he carries can also be destructive."},"items":[{"media":"prologue","caption":{"en":"Whisp Prologue","ru":"Whisp Prologue"}},{"media":"selected-main-anti-wide","caption":{"en":"Encounter in the dark","ru":"Встреча во тьме"}},{"media":"texture","caption":{"en":"Whisp — texture","ru":"Whisp — фактура"}}],"time":"","layout":"feature"},{"id":"works","section":"idea","title":{"ru":"Мои работы","en":"Previous works"},"text":{"ru":"Prologue и Inescapble Essence. Новая история располагается между ними - Tremor of happines.\n","en":"Prologue and Inescapable Essence. The new story takes place between them: Tremor of Happiness.\n"},"notes":{"ru":"\n","en":"\n"},"items":[{"media":"prologue","caption":{"en":"Whisp Prologue","ru":"Whisp Prologue"}},{"media":"story","caption":{"en":"Whisp Story 2","ru":"Whisp Story 2"}},{"media":"user-e89038d5-4d43-46ac-95bb-14497731527d","caption":{"ru":"Memories of Our End [Fun made teaser]","en":"Memories of Our End [Fan-made teaser]"}}],"time":"","layout":"grid"},{"id":"meaning","section":"idea","title":{"ru":"Что я хочу передать","en":"What I want to convey"},"text":{"ru":"Покой → падение во тьму → борьба → бремя. Желание выйти к свету и неизбежность возвращения во тьму. ","en":"Stillness → descent into darkness → struggle → burden. The desire to reach the light, and the inevitability of returning to darkness."},"notes":{"ru":"Висп связан со Светом — слабым двойником без маски, который раз за разом погибает во тьме. Висп — его сильнейшая часть. Долгое спокойствие превращает Виспа в ужас; чтобы существовать и не стать концом человечества, он должен страдать. Во тьме он сражается с демонами — слабостями и страхами. Победа не гарантирована. Ему суждено уничтожить демонов и Свет; Свет становится прикованной к нему ношей. Только освободившись от неё, Висп покидает тьму.","en":"Whisp is bound to the Light: a fragile, unmasked double who dies in the darkness again and again. Whisp is his strongest part. Prolonged peace turns Whisp into a horror; to exist without becoming the end of humanity, he must suffer. In the darkness, he fights demons — his weaknesses and fears. Victory is never certain. He is destined to destroy both the demons and the Light; the Light becomes a burden chained to him. Only by freeing himself from that burden can Whisp leave the darkness."},"items":[{"media":"encounter","caption":{"en":"Encounter in the dark","ru":"Встреча во тьме"}},{"media":"drag","caption":{"en":"Whisp drags his burden","ru":"Висп тащит бремя"}},{"media":"burden","caption":{"en":"Burden — loop","ru":"Бремя — петля"}}],"time":"","layout":"feature"},{"id":"style","section":"style","title":{"ru":"Визуальный стиль","en":"Visual style"},"text":{"ru":"Фактура, контраст, обработка и движение. Существующие работы — ориентир для нового визуала.","en":"Texture, contrast, treatment and motion. Existing work provides the reference for the new visuals."},"notes":{"ru":"Подборка из предоставленных файлов. Дополнительные работы whisp_irl будут добавлены после отбора.","en":"A selection from the supplied files. More whisp_irl works can be added after selection."},"items":[{"media":"mood-whisp","caption":{"ru":"Whisp — W_4","en":"Whisp — W_4"}},{"media":"mood-fall","caption":{"ru":"FALL","en":"FALL"}},{"media":"user-9ed33639-d7ea-4a8b-bcc2-5bd32c7b1b23","caption":{"ru":"Новый блок","en":"New block"}},{"media":"mood-sketch4","caption":{"ru":"Иллюстрация 04","en":"Illustration 04"}},{"media":"mood-strings","caption":{"ru":"IMG_1316","en":"IMG_1316"}},{"media":"user-81166364-880c-4ff0-aa3a-cf0974313bef","caption":{"ru":"Новый блок","en":"New block"}},{"media":"user-d5f3a747-5c9a-4265-b543-cabc4fdb96f1","caption":{"ru":"Новый блок","en":"New block"}},{"media":"user-473b22f2-fbe8-4c67-a51e-301a27c4b28c","caption":{"ru":"Новый блок","en":"New block"}},{"media":"texture","caption":{"ru":"Новый блок","en":"New block"}},{"media":"selected-opening-panorama","caption":{"ru":"Новый блок","en":"New block"}},{"media":"fear-reference","caption":{"ru":"Новый блок","en":"New block"}},{"media":"selected-main-house","caption":{"ru":"Новый блок","en":"New block"}},{"media":"user-ba762c81-669b-4983-9653-7e44ff7cb3e7","caption":{"ru":"Новый блок","en":"New block"}},{"media":"user-34f14bd0-e2bf-4aad-bf43-308e21a6b0ba","caption":{"ru":"Новый блок","en":"New block"}},{"media":"user-e53e64af-f5da-4573-a4db-70c2b1fd231b","caption":{"ru":"Новый блок","en":"New block"}},{"media":"user-fd759bb3-1dda-40ef-bb80-58321677e2ec","caption":{"ru":"Новый блок","en":"New block"}},{"media":null,"caption":{"ru":"Новый блок","en":"New block"}},{"media":"online-dark-stuff","caption":{"ru":"Most dark stuff what i make (i think)","en":"Most dark stuff what i make (i think)"}},{"media":"online-w8-for","caption":{"ru":"WHAT R U W8 FOR?","en":"WHAT R U W8 FOR?"}},{"media":"online-paranoia","caption":{"ru":"All in one. Paranoia.","en":"All in one. Paranoia."}}],"time":"","layout":"grid"},{"id":"characters","section":"style","title":{"ru":"Персонажи","en":"Characters"},"text":{"ru":"Whisp — центральный персонаж. Образ Света и роль других концептов уточняются отдельно.","en":"Whisp is the central character. The Light’s appearance and the roles of other concepts are to be clarified separately."},"notes":{"ru":"Anti не назначен демоном или противником в сценарии. Образ Света — слабый двойник без маски, по исходному лору.","en":"Anti has not been assigned a demon or antagonist role in the scenario. In the original lore, the Light is a fragile, unmasked double."},"items":[{"media":"character","caption":{"en":"Whisp — character","ru":"Whisp — персонаж"}},{"media":"ruins","caption":{"en":"Whisp in a ruined world","ru":"Whisp в разрушенном мире"}},{"media":"anti","caption":{"ru":"Anti — отдельный концепт","en":"Anti — separate concept"}},{"media":null,"caption":{"ru":"Свет — добавить концепт","en":"The Light — add a concept"}}],"time":"","layout":"grid"},{"id":"locations","section":"style","title":{"ru":"Мир и локации","en":"World and locations"},"text":{"ru":"Ядерная зима и руины нашей цивилизации. В начале — больше ландшафтов и масштаба, меньше персонажа.","en":"Nuclear winter and the ruins of our civilization. The opening emphasizes landscapes and scale, with minimal character presence."},"notes":{"ru":"Под землёй существует цивилизация выживших. История Whisp проходит в смежной вселенной.","en":"A civilization of survivors exists underground. Whisp’s story unfolds in an adjacent universe."},"items":[{"media":"selected-opening-panorama","caption":{"ru":"01 · Панорама разрушенного города","en":"01 · Ruined city panorama"}},{"media":"selected-opening-street","caption":{"ru":"02 · Заснеженная улица","en":"02 · Snow-covered street"}},{"media":"selected-opening-bridge","caption":{"ru":"03 · Замёрзшая река и мост","en":"03 · Frozen river and bridge"}},{"media":"selected-opening-hall","caption":{"ru":"04 · Пустой зал","en":"04 · Empty hall"}},{"media":"selected-opening-corridor","caption":{"ru":"05 · Заброшенный коридор","en":"05 · Abandoned corridor"}},{"media":"selected-opening-apartment","caption":{"ru":"06 · Квартира: следы жизни","en":"06 · Apartment: traces of life"}},{"media":"boat","caption":{"ru":"Холод — референс атмосферы","en":"Cold — atmosphere reference"}},{"media":"end","caption":{"ru":"Спокойствие — видео-референс","en":"Stillness — video reference"}}],"time":"","layout":"grid"},{"id":"opening","section":"story","title":{"ru":"Спокойствие и поиск","en":"Stillness and searching"},"text":{"ru":"Плавное атмосферное начало. Ландшафты разрушенного мира //Под музыкальный ритм и настроение. Погружение в локацию происходит ближе к развязке музыке - основной сценой является улица с окаменелыми людьми. Люди застывшие в различных позах отображающие ужас, страх, грусть, тоску, ненависть - и все те эмоции в которых можно застрять на всегда. ","en":"A slow, atmospheric opening. Landscapes of the ruined world follow the music’s rhythm and mood. As the music approaches its climax, we move deeper into the setting. The main scene is a street filled with petrified people. They are frozen in different poses expressing horror, fear, sadness, longing, hatred — all the emotions in which someone can remain trapped forever."},"notes":{"ru":"По первоначальной идее сначала идут холодные пейзажи, затем первая синт-мелодия и лица. Точная граница внутри 0:00–1:32 не указана. Не назначаем её без прослушивания.","en":"The original idea begins with cold landscapes, followed by the first synth melody and faces. The exact boundary within 0:00–1:32 has not been specified and will be set after listening."},"items":[{"media":"selected-opening-panorama","caption":{"ru":"01 · Панорама разрушенного города","en":"01 · Ruined city panorama"}},{"media":"selected-opening-street","caption":{"ru":"02 · Заснеженная улица","en":"02 · Snow-covered street"}},{"media":"selected-opening-bridge","caption":{"ru":"03 · Замёрзшая река и мост","en":"03 · Frozen river and bridge"}},{"media":"selected-opening-hall","caption":{"ru":"04 · Пустой зал","en":"04 · Empty hall"}},{"media":"selected-opening-corridor","caption":{"ru":"05 · Заброшенный коридор","en":"05 · Abandoned corridor"}},{"media":"selected-opening-apartment","caption":{"ru":"06 · Квартира: следы жизни","en":"06 · Apartment: traces of life"}},{"media":null,"caption":{"ru":"Замёрзшие или окаменелые люди","en":"Frozen or petrified people"}},{"media":null,"caption":{"ru":"Крупные планы неподвижных лиц","en":"Close-ups of motionless faces"}}],"time":"0:00 — 1:32","layout":"grid"},{"id":"impact","section":"story","title":{"ru":"Притяжение тьмы","en":"The pull of darkness"},"text":{"ru":"Врыв гитар и барабанов. Резкое и дерзкое переключение кадров сцен с окаменелыми лицами под музыку. ((Пока ищу на чем может быть обоснован переход во тьму. Для обычного перехода, Висп чаще сам себя уничтожает ибо тьма в его голове захватывает его разум. Однако тьма может прийти из вне и затянуть в густой водоворот грез - одна метафора на состояние мира, которое со всех сторон так и тянет упасть с головой во мрак)).","en":"Guitars and drums burst in. Abrupt, bold cuts between shots of petrified faces follow the music. ((I am still looking for what could motivate the transition into darkness. Usually, Whisp destroys himself because the darkness in his head takes over his mind. Yet darkness can also arrive from outside and pull him into a dense whirlpool of visions — a metaphor for a world that, from every direction, seems to lure us into plunging headfirst into the dark.))"},"notes":{"ru":"Первый тяжёлый врыв — по новой разметке. Падение и омут — из исходного сценария. Промежуток 1:47–1:49 и точное место перехода нужно уточнить.","en":"The first heavy impact follows the updated timing. The fall and vortex come from the original scenario. The 1:47–1:49 interval and the exact transition need clarification."},"items":[{"media":"selected-impact-approach","caption":{"ru":"01 · Приближение к окаменелым","en":"01 · Approaching the petrified figures"}},{"media":"selected-impact-whisp","caption":{"ru":"02 · Висп среди окаменелых","en":"02 · Whisp among the petrified"}},{"media":"selected-impact-poses","caption":{"ru":"03 · Застывшие в страхе","en":"03 · Frozen in fear"}},{"media":"selected-impact-faces","caption":{"ru":"04 · Искажённые лица","en":"04 · Distorted faces"}},{"media":"selected-impact-ice","caption":{"ru":"05 · Лица подо льдом","en":"05 · Faces beneath the ice"}},{"media":"mood-eye","caption":{"ru":"Притяжение — настроение","en":"The pull — mood reference"}},{"media":"vortex","caption":{"en":"The dark vortex","ru":"Омут тьмы"}},{"media":"selected-impact-fall","caption":{"ru":"Падение в круговорот","en":"Falling into the vortex"}}],"time":"1:32 — 1:47","layout":"grid"},{"id":"main","section":"story","title":{"ru":"Борьба во тьме","en":"Struggle in the darkness"},"text":{"ru":"Основная часть. Тизерная нарезка событий и сюжетов: борьба, падения, победы и поражения. Не имеющего последовательного повествования, это больше передача настроения, разных эмоций и кусков общего лора персонажа Висп. ","en":"The main section. A teaser montage of events and story fragments: struggle, falls, victories and defeats. There is no linear narrative; it is more about conveying a mood, different emotions and fragments of Whisp’s wider lore."},"notes":{"ru":"Мелодия и гитарное соло — из первоначального описания основной части. Точный набор сцен пока открыт.","en":"The melody and guitar solo follow the original description of the main section. The exact selection of scenes remains open."},"items":[{"media":"selected-main-nightmare","caption":{"ru":"01 · Перед кошмаром — масштаб","en":"01 · Facing the nightmare — scale"}},{"media":"selected-main-anti-wide","caption":{"ru":"02 · Встреча с Anti","en":"02 · Encounter with Anti"}},{"media":"selected-main-anti-close","caption":{"ru":"03 · Anti — глаза во тьме","en":"03 · Anti — eyes in the darkness"}},{"media":"selected-main-anti-sketch","caption":{"ru":"04 · Anti — скетч","en":"04 · Anti — sketch"}},{"media":"selected-main-flight","caption":{"ru":"05 · Бегство от кошмара — скетч","en":"05 · Flight from the nightmare — sketch"}},{"media":"selected-main-surrounded","caption":{"ru":"06 · В окружении тьмы — скетч","en":"06 · Surrounded by darkness — sketch"}},{"media":"selected-main-water","caption":{"ru":"07 · Фигура в воде — скетч","en":"07 · Figure in the water — sketch"}},{"media":"selected-main-rescue","caption":{"ru":"08 · Попытка вытащить из тьмы","en":"08 · Trying to pull someone out of darkness"}},{"media":"selected-main-house","caption":{"ru":"09 · Горящий дом","en":"09 · Burning house"}},{"media":"story","caption":{"en":"Whisp Story 2","ru":"Whisp Story 2"}}],"time":"1:49 — 3:25","layout":"grid"},{"id":"second-impact","section":"story","title":{"ru":"Второй тяжёлый врыв","en":"Second heavy impact"},"text":{"ru":"Новый всплеск тяжести. Здесь нужно выбрать события и характер движения под музыку.","en":"Another surge of heaviness. The events and movement for this section still need to be selected."},"notes":{"ru":"Новая разметка определяет этот участок как тяжёлый врыв. Ранее здесь обсуждался синт-проигрыш: поэтому бремя и спокойные петли пока не закреплены за этим таймкодом.","en":"The updated timing identifies this as a heavy impact. An earlier idea mentioned a synth interlude, so the burden and quiet loops have not been assigned to this time range."},"items":[{"media":"texture","caption":{"ru":"Фактура — референс","en":"Texture — reference"}},{"media":null,"caption":{"ru":"Кадры для тяжёлого врыва","en":"Shots for the heavy impact"}},{"media":null,"caption":{"ru":"Движение и ритм","en":"Motion and rhythm"}},{"media":null,"caption":{"ru":"Переход в атмосферную часть","en":"Transition into the atmospheric section"}}],"time":"3:25 — 3:56","layout":"grid"},{"id":"dark-atmosphere","section":"story","title":{"ru":"Злая атмосфера","en":"Menacing atmosphere"},"text":{"ru":"Злой атмосферный саунд. Ощущение проклятия и неизбежности возвращения во тьму.","en":"A menacing atmospheric sound. A sense of the curse and the inevitability of returning to darkness."},"notes":{"ru":"Бремя, падения и спокойные арт-петли остаются частью идеи. Их точное положение в музыке нужно согласовать; здесь они показаны как варианты для обсуждения.","en":"The burden, falls and quiet art loops remain part of the idea. Their exact position in the music needs to be agreed; here they are shown as options for discussion."},"items":[{"media":"export","caption":{"ru":"Whisp_irl — визуальный язык","en":"Whisp_irl — visual language"}},{"media":"drag","caption":{"ru":"Бремя — вариант для обсуждения","en":"Burden — option for discussion"}},{"media":"burden","caption":{"ru":"Петля — вариант для обсуждения","en":"Loop — option for discussion"}},{"media":null,"caption":{"ru":"Возвращение во тьму","en":"Returning to darkness"}}],"time":"3:56 — 4:39","layout":"grid"},{"id":"ending","section":"story","title":{"ru":"Завершение — уточнить","en":"Ending — to clarify"},"text":{"ru":"Композиция длится около пяти минут. Последний отрезок пока не описан.","en":"The composition is about five minutes long. The last segment has not yet been described."},"notes":{"ru":"Не закрепляем финальную сцену до уточнения музыки. Исходная идея финала — неизбежность возвращения во тьму.","en":"The final scene will be decided once the music is clarified. The original ending idea is the inevitability of returning to darkness."},"items":[{"media":null,"caption":{"ru":"Музыкальное завершение — уточнить","en":"Musical ending — to clarify"}},{"media":null,"caption":{"ru":"Последний кадр — определить","en":"Final image — to decide"}}],"time":"4:39 — ≈5:00","layout":"pair"}],"texts":[{"id":"text-idea","title":{"ru":"Whisp × Tyler Bates","en":"Whisp × Tyler Bates"},"body":{"ru":"Визуал композиции через существующий мир Whisp. В основе — вечная борьба с собой, своими слабостями и страхами.","en":"The composition’s visuals through Whisp’s existing world. An endless struggle with oneself, one’s weaknesses and fears."},"notes":{"ru":"Я предлагаю развить свой лор и визуальный язык. Главный переход — от холодного спокойствия во тьму. Свет не каждому во благо: Виспу необходимо нести своё проклятие. Музыка — около пяти минут; аудиофайл сюда не добавлен.","en":"I propose developing my existing lore and visual language. The central transition is from cold stillness into darkness. Light does not bring good to everyone: Whisp must bear his curse. The music is about five minutes long; its audio has not been added here."}},{"id":"text-works","title":{"ru":"Мои работы","en":"Previous works"},"body":{"ru":"Prologue и Story 2 — отправная точка. Новая история располагается между ними.","en":"Prologue and Story 2 are the starting point. The new story takes place between them."},"notes":{"ru":"Показываем уже сделанные анимации: атмосферу мира, персонажа и события во тьме. Для Story 2 используется предоставленный файл с суффиксом PREV.","en":"Show the existing animations: the world’s atmosphere, the character and events in the darkness. Story 2 uses the supplied file with the PREV suffix."}},{"id":"text-meaning","title":{"ru":"Что я хочу передать","en":"What I want to convey"},"body":{"ru":"Покой → падение во тьму → борьба → бремя. Желание выйти к свету и неизбежность возвращения во тьму.","en":"Stillness → descent into darkness → struggle → burden. The desire to reach the light, and the inevitability of returning to darkness."},"notes":{"ru":"Висп связан со Светом — слабым двойником без маски, который раз за разом погибает во тьме. Висп — его сильнейшая часть. Долгое спокойствие превращает Виспа в ужас; чтобы существовать и не стать концом человечества, он должен страдать. Во тьме он сражается с демонами — слабостями и страхами. Победа не гарантирована. Ему суждено уничтожить демонов и Свет; Свет становится прикованной к нему ношей. Только освободившись от неё, Висп покидает тьму.","en":"Whisp is bound to the Light: a fragile, unmasked double who dies in the darkness again and again. Whisp is his strongest part. Prolonged peace turns Whisp into a horror; to exist without becoming the end of humanity, he must suffer. In the darkness, he fights demons — his weaknesses and fears. Victory is never certain. He is destined to destroy both the demons and the Light; the Light becomes a burden chained to him. Only by freeing himself from that burden can Whisp leave the darkness."}},{"id":"text-style","title":{"ru":"Визуальный стиль","en":"Visual style"},"body":{"ru":"Фактура, контраст, обработка и движение. Существующие работы — ориентир для нового визуала.","en":"Texture, contrast, treatment and motion. Existing work provides the reference for the new visuals."},"notes":{"ru":"Подборка из предоставленных файлов. Дополнительные работы whisp_irl будут добавлены после отбора.","en":"A selection from the supplied files. More whisp_irl works can be added after selection."}},{"id":"text-characters","title":{"ru":"Персонажи","en":"Characters"},"body":{"ru":"Whisp — центральный персонаж. Образ Света и роль других концептов уточняются отдельно.","en":"Whisp is the central character. The Light’s appearance and the roles of other concepts are to be clarified separately."},"notes":{"ru":"Anti не назначен демоном или противником в сценарии. Образ Света — слабый двойник без маски, по исходному лору.","en":"Anti has not been assigned a demon or antagonist role in the scenario. In the original lore, the Light is a fragile, unmasked double."}},{"id":"text-locations","title":{"ru":"Мир и локации","en":"World and locations"},"body":{"ru":"Ядерная зима и руины нашей цивилизации. В начале — больше ландшафтов и масштаба, меньше персонажа.","en":"Nuclear winter and the ruins of our civilization. The opening emphasizes landscapes and scale, with minimal character presence."},"notes":{"ru":"Под землёй существует цивилизация выживших. История Whisp проходит в смежной вселенной. Новые изображения пока не генерируем.","en":"A civilization of survivors exists underground. Whisp’s story unfolds in an adjacent universe. New images are not being generated yet."}},{"id":"text-opening","title":{"ru":"Спокойствие и поиск","en":"Stillness and searching"},"body":{"ru":"Плавное атмосферное начало. Ландшафты разрушенного мира; затем — застывшие люди. Висп появляется сдержанно.","en":"A slow, atmospheric opening. Landscapes of the ruined world, followed by motionless people. Whisp’s presence is restrained."},"notes":{"ru":"По первоначальной идее сначала идут холодные пейзажи, затем первая синт-мелодия и лица. Точная граница внутри 0:00–1:32 не указана. Не назначаем её без прослушивания.","en":"The original idea begins with cold landscapes, followed by the first synth melody and faces. The exact boundary within 0:00–1:32 has not been specified and will be set after listening."}},{"id":"text-impact","title":{"ru":"Притяжение тьмы","en":"The pull of darkness"},"body":{"ru":"Врыв гитар и барабанов. Лица оживают; Виспа втягивает во тьму.","en":"Guitars and drums burst in. The faces come alive; Whisp is drawn into darkness."},"notes":{"ru":"Первый тяжёлый врыв — по новой разметке. Падение и омут — из исходного сценария. Промежуток 1:47–1:49 и точное место перехода нужно уточнить.","en":"The first heavy impact follows the updated timing. The fall and vortex come from the original scenario. The 1:47–1:49 interval and the exact transition need clarification."}},{"id":"text-main","title":{"ru":"Борьба во тьме","en":"Struggle in the darkness"},"body":{"ru":"Основная часть. Тизерная нарезка событий и сюжетов: борьба, падения, победы и поражения.","en":"Main section. A teaser montage of events and story fragments: struggle, falls, victories and defeats."},"notes":{"ru":"Мелодия и гитарное соло — из первоначального описания основной части. Точный набор сцен пока открыт.","en":"The melody and guitar solo follow the original description of the main section. The exact selection of scenes remains open."}},{"id":"text-second-impact","title":{"ru":"Второй тяжёлый врыв","en":"Second heavy impact"},"body":{"ru":"Новый всплеск тяжести. Здесь нужно выбрать события и характер движения под музыку.","en":"Another surge of heaviness. The events and movement for this section still need to be selected."},"notes":{"ru":"Новая разметка определяет этот участок как тяжёлый врыв. Ранее здесь обсуждался синт-проигрыш: поэтому бремя и спокойные петли пока не закреплены за этим таймкодом.","en":"The updated timing identifies this as a heavy impact. An earlier idea mentioned a synth interlude, so the burden and quiet loops have not been assigned to this time range."}},{"id":"text-dark-atmosphere","title":{"ru":"Злая атмосфера","en":"Menacing atmosphere"},"body":{"ru":"Злой атмосферный саунд. Ощущение проклятия и неизбежности возвращения во тьму.","en":"A menacing atmospheric sound. A sense of the curse and the inevitability of returning to darkness."},"notes":{"ru":"Бремя, падения и спокойные арт-петли остаются частью идеи. Их точное положение в музыке нужно согласовать; здесь они показаны как варианты для обсуждения.","en":"The burden, falls and quiet art loops remain part of the idea. Their exact position in the music needs to be agreed; here they are shown as options for discussion."}},{"id":"text-ending","title":{"ru":"Завершение — уточнить","en":"Ending — to clarify"},"body":{"ru":"Композиция длится около пяти минут. Последний отрезок пока не описан.","en":"The composition is about five minutes long. The last segment has not yet been described."},"notes":{"ru":"Не закрепляем финальную сцену до уточнения музыки. Исходная идея финала — неизбежность возвращения во тьму.","en":"The final scene will be decided once the music is clarified. The original ending idea is the inevitability of returning to darkness."}}],"idia":{"nodes":[{"id":"idea","title":{"ru":"Основная идея","en":"Central idea"},"body":{"ru":"Визуальная история для композиции Тайлера строится на существующем лоре Whisp и моём визуальном языке. Я хочу развить мир, в котором уже работаю, и через него передать движение музыки.\n\nВ центре — вечная борьба с собой: со слабостями, страхами и тёмными мыслями. Whisp стремится к свету, но спокойствие не освобождает его. Чтобы сохранить себя и не стать угрозой для других, он вынужден возвращаться во тьму и нести своё проклятие.","en":"The visual story for Tyler’s composition grows from Whisp’s existing lore and my visual language. I want to develop the world I already work in and use it to express the movement of the music.\n\nAt its center is an endless struggle with oneself: with weakness, fear and dark thoughts. Whisp longs for the light, yet peace does not free him. To preserve himself and avoid becoming a threat to others, he must return to the darkness and bear his curse."},"x":660,"y":460,"group":"core","sources":[]},{"id":"world","title":{"ru":"Мир","en":"World"},"body":{"ru":"Мир Memories of Our End давно разрушен. На поверхности — ядерная зима и руины нашей цивилизации. Под землёй выжившие создали новую цивилизацию поселений.\n\nИстория Whisp разворачивается в смежной вселенной. Это часть более широкого мира, через который персонаж проходит, пересекая время, реальности и события.","en":"The world of Memories of Our End was destroyed long ago. Above ground lie nuclear winter and the ruins of our civilization. Underground, survivors have formed a new civilization of settlements.\n\nWhisp’s story unfolds in an adjacent universe. It belongs to a wider world through which the character moves, crossing time, realities and events."},"x":180,"y":145,"group":"lore","sources":[]},{"id":"whisp","title":{"ru":"Whisp","en":"Whisp"},"body":{"ru":"Whisp — персонаж в маске, чьё существование связано с вечной борьбой и поиском. Он проходит сквозь время и вселенные, пытаясь найти ответы на вопросы о мироздании и о себе.\n\nОн — сильнейшая часть Света, но сила не делает его свободным. Whisp способен меняться и падать во тьму; именно это противоречие определяет его путь.","en":"Whisp is a masked character whose existence is bound to an endless struggle and search. He moves through time and universes, seeking answers about existence and himself.\n\nHe is the strongest part of the Light, but strength does not make him free. Whisp can change and fall into darkness; this contradiction defines his path."},"x":420,"y":260,"group":"lore","sources":[]},{"id":"light","title":{"ru":"Свет","en":"The Light"},"body":{"ru":"Свет — слабый двойник Whisp без маски: образ клона, брата, другой части одного целого. Он раз за разом погибает во тьме. Его судьба становится проклятием Whisp.\n\nВо тьме Whisp сражается за Свет, подверженный упадку. Однако эта связь не ведёт к простому спасению: в конце пути ему суждено уничтожить и демонов, и сам Свет.","en":"The Light is Whisp’s fragile, unmasked double: a clone, a brother, another part of the same whole. He dies in the darkness again and again. His fate becomes Whisp’s curse.\n\nIn the darkness, Whisp fights for the Light as it declines. Yet their bond offers no simple rescue: eventually, he is destined to destroy both the demons and the Light itself."},"x":690,"y":120,"group":"lore","sources":[]},{"id":"curse","title":{"ru":"Проклятие покоя","en":"The curse of peace"},"body":{"ru":"Если Whisp слишком долго остаётся вне тьмы — в спокойствии или в поиске ответов, — он постепенно превращается в ужас. Чтобы существовать и не стать концом человечества, ему необходимо страдать.\n\nЭто главное противоречие лора: то, что выглядит освобождением, может стать опасностью. Свет и покой не всегда во благо; возвращение во тьму становится условием существования.","en":"If Whisp stays outside the darkness too long — in peace or in search of answers — he gradually becomes a horror. To continue existing without bringing about humanity’s end, he must suffer.\n\nThis is the lore’s central contradiction: what appears to be freedom can become a danger. Light and peace are not always a blessing; returning to darkness becomes a condition of existence."},"x":940,"y":240,"group":"lore","sources":[]},{"id":"fall","title":{"ru":"Падение во тьму","en":"Descent into darkness"},"body":{"ru":"Whisp может сам уничтожить себя, упасть в омут тьмы или быть забранным из мира кем-то или чем-то. Способ перехода меняется, но каждый раз он возвращает персонажа к борьбе.\n\nВ этой анимации переход начинается с застывших лиц. Они оживают, от них исходит зловещее притяжение, и Whisp затягивает в круговорот тьмы и душ.","en":"Whisp may destroy himself, fall into a dark vortex or be taken from a world by someone or something. The form of the transition changes, but each return brings him back to the struggle.\n\nIn this animation, the transition begins with motionless faces. They come alive and exert a sinister pull, drawing Whisp into a vortex of darkness and souls."},"x":1110,"y":460,"group":"lore","sources":[]},{"id":"demons","title":{"ru":"Демоны и борьба","en":"Demons and struggle"},"body":{"ru":"Демоны во тьме связаны со слабостями и страхами. Whisp приходится сражаться с ними, побеждать и проигрывать. Здесь нет исхода, который всегда был бы верным или гарантированным.\n\nВизуально эта борьба раскрывается через отдельные события и сюжетные фрагменты. Монтаж может передавать разные состояния персонажа, сохраняя общую тему внутреннего противостояния.","en":"The demons in the darkness are connected to weakness and fear. Whisp must fight them, winning and losing. There is no outcome that is always right or guaranteed.\n\nVisually, this struggle unfolds through individual events and story fragments. The montage can express different states of the character while retaining the shared theme of inner conflict."},"x":980,"y":720,"group":"lore","sources":[]},{"id":"burden","title":{"ru":"Бремя","en":"The burden"},"body":{"ru":"После уничтожения демонов и Света связь не исчезает: Свет становится ношей, прикованной к Whisp и тянущей его вниз. Только освободившись от этого бремени, Whisp может покинуть тьму.\n\nОбраз персонажа, тащащего свою ношу, — один из ключевых визуальных мотивов. Для него уже существуют видео и зацикленные арты. Его точное место в музыке ещё нужно определить.","en":"After the demons and the Light are destroyed, the bond remains: the Light becomes a burden chained to Whisp, dragging him down. Only by freeing himself from it can Whisp leave the darkness.\n\nThe character dragging his burden is one of the key visual motifs. Videos and looping artwork already exist for it. Its exact place in the music still needs to be determined."},"x":700,"y":850,"group":"lore","sources":[]},{"id":"return","title":{"ru":"Возвращение","en":"The return"},"body":{"ru":"Выход из тьмы не отменяет проклятие. Главная метафора финала — неизбежность возвращения к внутренней борьбе.\n\nФинальные образы должны передавать эту связь через зловещую атмосферу и визуальный язык Whisp_irl. Конкретный последний кадр и музыкальное завершение пока остаются открытыми.","en":"Leaving the darkness does not undo the curse. The ending’s central metaphor is the inevitability of returning to the inner struggle.\n\nThe final images should express this through a sinister atmosphere and Whisp_irl’s visual language. The exact last image and the musical ending remain open."},"x":425,"y":795,"group":"lore","sources":[]},{"id":"inner","title":{"ru":"Внутренняя тьма","en":"Inner darkness"},"body":{"ru":"Для меня тьма — образ тяжёлого внутреннего состояния, в котором страхи и тёмные мысли захватывают человека. Он продолжает жить, но ощущает себя запертым внутри собственного сознания.\n\nЭто личная художественная метафора, через которую я связываю переживание человека с лором Whisp. Она помогает объяснить, почему борьба персонажа не заканчивается одной победой и почему освобождение не бывает окончательным.","en":"For me, darkness is an image of a difficult inner state in which fear and dark thoughts take hold of a person. Life continues, but the person feels trapped within their own mind.\n\nThis is a personal artistic metaphor connecting human experience with Whisp’s lore. It helps explain why the character’s struggle does not end with a single victory and why release is never final."},"x":160,"y":580,"group":"meaning","sources":[]},{"id":"one","title":{"ru":"Metallica — One","en":"Metallica — One"},"body":{"ru":"Меня вдохновляет лирика One. В песне история солдата связана с утратой возможности видеть, говорить, слышать и действовать. В моей идее этот образ перекликается с другим заточением — внутренней тьмой человека.\n\nСтроки «Darkness, imprisoning me» и «Trapped in myself» особенно близки этому ощущению. Я переношу образ невозможности вырваться из себя в мир Whisp: персонаж живёт, борется и ищет выход, но остаётся связан со своим проклятием.\n\nЭто моя интерпретация и источник вдохновения, а не буквальная экранизация песни. Музыкой проекта остаётся композиция Тайлера.","en":"I am inspired by the lyrics of One. The song’s soldier is deprived of the ability to see, speak, hear and act. In my idea, this image resonates with a different captivity: the darkness within a person.\n\nThe lines “Darkness, imprisoning me” and “Trapped in myself” feel especially close to this state. I bring the image of being unable to escape oneself into Whisp’s world: the character lives, struggles and searches for a way out, yet remains bound to his curse.\n\nThis is my interpretation and a source of inspiration, not a literal adaptation of the song. Tyler’s composition remains the project’s music."},"x":135,"y":345,"group":"meaning","sources":[{"title":"One — Darkness, imprisoning me","url":"https://genius.com/1098714/Metallica-one/Darkness-imprisoning-me-all-that-i-see-absolute-horror"},{"title":"One — Trapped in myself","url":"https://genius.com/1098717/Metallica-one/I-cannot-live-i-cannot-die-trapped-in-myself-body-my-holding-cell"}]},{"id":"music","title":{"ru":"Музыка Тайлера","en":"Tyler’s music"},"body":{"ru":"Музыка задаёт переход от холодного спокойствия к тяжести и злой атмосфере. Визуал должен развиваться вместе с ней, используя уже существующие образы Whisp.\n\nТекущая разметка дана по описанию: 0:00–1:32 — плавная атмосфера; 1:32–1:47 — врыв гитар и барабанов; 1:49–3:25 — основная часть; 3:25–3:56 — второй тяжёлый врыв; 3:56–4:39 — злой атмосферный саунд.\n\nПромежуток 1:47–1:49 и завершение после 4:39 ещё нужно уточнить. Композиция длится около пяти минут; точная привязка сцен потребует прослушивания.","en":"The music drives a transition from cold stillness into heaviness and a menacing atmosphere. The visuals should develop with it, using Whisp’s existing imagery.\n\nThe current timing follows the description: 0:00–1:32 — a slow atmosphere; 1:32–1:47 — guitars and drums burst in; 1:49–3:25 — the main section; 3:25–3:56 — a second heavy impact; 3:56–4:39 — a menacing atmospheric sound.\n\nThe 1:47–1:49 interval and the ending after 4:39 still need clarification. The composition is about five minutes long; precise scene placement requires listening."},"x":1120,"y":100,"group":"visual","sources":[]},{"id":"sequence","title":{"ru":"Последовательность","en":"Visual sequence"},"body":{"ru":"1. Холодные ландшафты, руины и ядерная зима. В начале важнее масштаб и красота мира; присутствие Whisp сдержанное.\n\n2. Застывшие люди и крупные планы окаменелых лиц. Затем лица оживают, и персонажа начинает притягивать тьма.\n\n3. Падение в омут и общий план круговорота тьмы и душ.\n\n4. Тизерная нарезка событий во тьме: борьба, падения, победы и поражения.\n\n5. Бремя, зацикленные арт-вставки и более спокойные состояния. Их положение в новой музыкальной разметке ещё не закреплено.\n\n6. Зловещие образы и возвращение во тьму. Последний кадр определяется после уточнения финала композиции.","en":"1. Cold landscapes, ruins and nuclear winter. The opening prioritizes the world’s scale and beauty, with a restrained presence of Whisp.\n\n2. Motionless people and close-ups of petrified faces. The faces then come alive, and darkness begins to draw the character in.\n\n3. A fall into the vortex and a wide view of swirling darkness and souls.\n\n4. A teaser montage of events in the darkness: struggle, falls, victories and defeats.\n\n5. The burden, looping art inserts and quieter states. Their position within the updated musical timing is not yet fixed.\n\n6. Sinister images and a return to darkness. The last image will be decided once the composition’s ending is clarified."},"x":1300,"y":670,"group":"visual","sources":[]},{"id":"style","title":{"ru":"Стиль и материалы","en":"Style and materials"},"body":{"ru":"Основа визуала — мои анимации и арты: их фактура, контраст, обработка и движение. Prologue и Story 2 задают контекст; новая история располагается между ними по хронологии лора.\n\nМатериалы разделяются на мир и локации, персонажей и визуальные состояния. Они служат ориентирами для дальнейшей анимации, а не готовой раскадровкой. Новые концепты добавляются после уточнения структуры.","en":"The visuals are grounded in my animations and artwork: their texture, contrast, treatment and motion. Prologue and Story 2 establish the context; the new story falls between them in the lore’s chronology.\n\nThe materials cover the world and locations, characters and visual states. They guide the future animation rather than forming a finished storyboard. New concepts will be added after the structure is clarified."},"x":1250,"y":875,"group":"visual","sources":[]},{"id":"mood-art","Муд":"","title":{"ru":"Муд — авторские арты","en":"Mood — original artwork"},"body":{"ru":"Новая подборка для визуального языка проекта: FALL, W_4, eye1, HATE, BES1, четыре иллюстрации и IMG_1316.\n\nРаботы показывают контраст белой линии и чёрного пространства, тонкую штриховую фактуру, падение, преследование и образы существ. Их роль в конкретных сценах ещё можно менять.","en":"An additional selection for the project’s visual language: FALL, W_4, eye1, HATE, BES1, four illustrations and IMG_1316.\n\nThe works show white lines against black space, fine scratched textures, falling, pursuit and creature imagery. Their roles in specific scenes remain adjustable."},"x":1360,"y":1040,"group":"visual","sources":[]},{"id":"notion-origin","title":{"ru":"Основа Whisp Lore","en":"Whisp Lore foundation"},"body":{"ru":"Висп вновь погружается в бездну и борется со страхами, ненавистью и слабостью, защищая уязвимую часть себя. Мир и стабильность постепенно превращаются в угрозу для окружающих.\n\nВ описании Prologue поиск смысла, возвращение к боли и тоске образуют повторяющийся цикл.","en":"Whisp repeatedly enters the abyss and fights fear, hatred and weakness to protect the vulnerable part of himself. Peace and stability gradually become a threat to those around him.\n\nThe Prologue description connects the search for meaning, returning pain and longing into a recurring cycle."},"x":1650,"y":160,"group":"lore","sources":[{"title":"Whisp Lore","url":"https://www.notion.so/db4dc7a9aeaf4173a6c8452d7cce775a"}]},{"id":"notion-wolf","title":{"ru":"Свет и волк · ранний набросок","en":"Light and the wolf · early draft"},"body":{"ru":"В ранних записях Свет связан с белым волком, который пожирает сгустки тьмы. Свет также означает рассудок, желание жить и способность продолжать борьбу.\n\nЭто ранний образ из сценарных заметок. В текущем изложении для Тайлера Свет описан как хрупкий двойник Виспа; эти версии не объединены в один утверждённый образ.","en":"Early notes associate Light with a white wolf that devours clots of darkness. Light also represents reason, the will to live and the capacity to keep fighting.\n\nThis is an early image from scenario notes. In the current Tyler concept, Light is described as Whisp’s fragile double; these versions have not been merged into one established form."},"x":1650,"y":460,"group":"lore","sources":[{"title":"Whisp part [ 1 ]","url":"https://www.notion.so/3be5b82b50fe437ebcae5157b924ab2f"}]},{"id":"notion-self","title":{"ru":"Self vs self · сценарный набросок","en":"Self vs self · scenario draft"},"body":{"ru":"Борьба с демонами в голове и собственной слабостью. В наброске чередуются Жнец, волк и схватки во тьме; Висп обещает отыскать волка.\n\nОн просыпается от кошмара в ледяной пустоши. Возвращение подчёркивает цикличность происходящего. Это материал для будущих историй, а не утверждённая последовательность клипа.","en":"A struggle against demons in the mind and personal weakness. The draft cuts between the Reaper, a wolf and battles in darkness; Whisp promises to find the wolf.\n\nHe wakes from a nightmare in an icy wasteland. The return reinforces the recurring cycle. This is material for future stories, rather than an approved sequence for the music video."},"x":1650,"y":760,"group":"lore","sources":[{"title":"whisp part 2.5 \u003cself vs self>","url":"https://www.notion.so/34c0acb3253a4d7c97308da7cbf7faab"}]},{"id":"petrified-fears","title":{"ru":"Окаменевшие в своих страхах","en":"Petrified in their own fears"},"body":{"ru":"Множество людей застыли в разных позах: от страха, боли и грусти. Кто-то закрывает лицо, кто-то сжимается, отступает или склоняется под тяжестью переживаний. Это метафора людей, которые застряли и окаменели в собственных страхах.\n\nЛица не должны выглядеть как обычные реалистичные каменные портреты. Их черты скошены, перекошены и частично стёрты — намеренно неестественные, как в предоставленном референсе. Позы передают разные внутренние состояния.\n\nВ сцене первой синтезаторной мелодии Висп оказывается среди этих неподвижных людей; общие планы множества фигур чередуются с крупными планами лиц. На первом гитарном дропе лица оживают, и их зловещее притяжение втягивает Виспа во тьму.","en":"Many people are frozen in different poses of fear, pain and sadness. Some hide their faces; others curl inward, recoil or bow under the weight of what they feel. They represent people trapped and petrified in their own fears.\n\nTheir faces should not resemble ordinary realistic stone portraits. Features are skewed, distorted and partially erased — deliberately unnatural, as in the supplied reference. Different poses express different inner states.\n\nDuring the first synth melody, Whisp finds himself among these motionless people; wide views of many figures alternate with close-ups of their faces. At the first guitar drop, the faces awaken and their sinister pull draws Whisp into darkness."},"x":1150,"y":1260,"group":"meaning","sources":[]},{"id":"flight-to-fight","title":{"ru":"От бегства к борьбе","en":"From flight to confrontation"},"body":{"ru":"Вначале Висп убегает от кошмара, страха, Anti и демонов. Но со временем ему надоедает бежать. Он перестаёт отступать: остаётся только сражаться с тем, от чего прежде пытался скрыться.\n\nЭто поворот от бегства к осознанному противостоянию в общей истории Виспа.\n\nПоследовательность: бегство → отказ убегать → борьба. Точное место поворота в музыкальном сценарии пока не определено.","en":"At first, Whisp runs from the nightmare, fear, Anti, and the demons. Eventually, he grows tired of running. He stops retreating: all that remains is to fight what he once tried to escape.\n\nThis marks the shift from flight to deliberate confrontation in Whisp’s wider story.\n\nSequence: flight → refusal to keep running → confrontation. The turning point’s precise placement within the music video remains undecided."},"x":710,"y":1100,"group":"meaning","sources":[{"title":"Whisp Lore","url":"https://www.notion.so/db4dc7a9aeaf4173a6c8452d7cce775a"}]}],"links":[{"id":"e0","fromId":"idea","toId":"whisp","label":{"ru":"раскрывается через","en":"expressed through"}},{"id":"e1","fromId":"world","toId":"whisp","label":{"ru":"пространство пути","en":"setting of the journey"}},{"id":"e2","fromId":"whisp","toId":"light","label":{"ru":"сильнейшая часть","en":"strongest part"}},{"id":"e3","fromId":"light","toId":"curse","label":{"ru":"судьба становится проклятием","en":"fate becomes a curse"}},{"id":"e4","fromId":"curse","toId":"fall","label":{"ru":"возвращает во тьму","en":"drives the return"}},{"id":"e5","fromId":"fall","toId":"demons","label":{"ru":"приводит к борьбе","en":"leads to struggle"}},{"id":"e6","fromId":"demons","toId":"burden","label":{"ru":"не завершается победой","en":"not resolved by victory"}},{"id":"e7","fromId":"light","toId":"burden","label":{"ru":"становится ношей","en":"becomes a burden"}},{"id":"e8","fromId":"burden","toId":"return","label":{"ru":"освобождение не окончательно","en":"release is not final"}},{"id":"e9","fromId":"return","toId":"curse","label":{"ru":"цикл продолжается","en":"the cycle continues"}},{"id":"e10","fromId":"idea","toId":"inner","label":{"ru":"метафора","en":"metaphor"}},{"id":"e11","fromId":"one","toId":"inner","label":{"ru":"личная ассоциация","en":"personal association"}},{"id":"e12","fromId":"inner","toId":"whisp","label":{"ru":"заточение внутри себя","en":"captivity within oneself"}},{"id":"e13","fromId":"idea","toId":"music","label":{"ru":"визуал для композиции","en":"visuals for the composition"}},{"id":"e14","fromId":"music","toId":"sequence","label":{"ru":"задаёт ритм","en":"sets the rhythm"}},{"id":"e15","fromId":"sequence","toId":"style","label":{"ru":"реализуется через","en":"realized through"}},{"id":"e16","fromId":"style","toId":"world","label":{"ru":"формирует образы","en":"shapes the imagery"}},{"id":"e17","fromId":"idea","toId":"burden","label":{"ru":"ключевой образ","en":"key image"}},{"id":"mood-style","fromId":"style","toId":"mood-art","label":{"ru":"дополняется работами","en":"expanded through artwork"}},{"id":"notion-origin-source","fromId":"notion-origin","toId":"curse","label":{"ru":"раскрывает тему","en":"develops the theme"}},{"id":"notion-wolf-source","fromId":"notion-wolf","toId":"light","label":{"ru":"раскрывает тему","en":"develops the theme"}},{"id":"notion-self-source","fromId":"notion-self","toId":"demons","label":{"ru":"раскрывает тему","en":"develops the theme"}},{"id":"petrified-inner","fromId":"petrified-fears","toId":"inner","label":{"ru":"метафора внутреннего плена","en":"metaphor for inner captivity"}},{"id":"petrified-demons","fromId":"petrified-fears","toId":"demons","label":{"ru":"страхи и слабости","en":"fears and weaknesses"}},{"id":"petrified-fall","fromId":"petrified-fears","toId":"fall","label":{"ru":"ожившие лица втягивают во тьму","en":"awakened faces draw him into darkness"}},{"id":"petrified-sequence","fromId":"petrified-fears","toId":"sequence","label":{"ru":"синтезаторная мелодия → первый дроп","en":"synth melody → first drop"}},{"id":"flight-to-fight-whisp","fromId":"flight-to-fight","toId":"whisp","label":{"ru":"поворот в пути персонажа","en":"turning point in his journey"}},{"id":"flight-to-fight-demons","fromId":"flight-to-fight","toId":"demons","label":{"ru":"от преследования к противостоянию","en":"from pursuit to confrontation"}},{"id":"flight-to-fight-inner","fromId":"flight-to-fight","toId":"inner","label":{"ru":"борьба с собственными страхами","en":"facing his own fears"}},{"id":"flight-to-fight-sequence","fromId":"flight-to-fight","toId":"sequence","label":{"ru":"бегство → решение сражаться","en":"flight → decision to fight"}},{"id":"flight-to-fight-notion-origin","fromId":"flight-to-fight","toId":"notion-origin","label":{"ru":"часть общего лора Whisp","en":"part of the wider Whisp lore"}}]},"contentUpdates":["mood-20260907","lore-tool-20260907","petrified-fears-20260907","flight-to-fight-20260907","selected-opening-20260907","selected-impact-20260907","selected-main-20260907","selected-impact-fall-20260907","english-20260909","webm-online-20260911"]}</script>
<script>
'use strict';
let data=JSON.parse(document.getElementById('presentation-data').textContent),current=0,editing=false,presenting=false,db=null,saveTimer,kind='image',replaceTarget=null,textId=null,busy=false;
const $=id=>document.getElementById(id),L=(ru,en)=>data.language==='ru'?ru:en,loc=v=>v&&typeof v==='object'?(v[data.language]||v.en||v.ru||''):(v??''),esc=v=>String(loc(v)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="15" width="7" height="7" rx="1"/><path d="M14 16h7M14 20h7"/></svg>';
const groups=[{id:'idea',ru:'Идея и мои работы',en:'Idea & previous works'},{id:'style',ru:'Стиль и мир',en:'Style & world'},{id:'story',ru:'Сценарий по музыке',en:'Scenario & music'}];
const storageKey='whisp-presentation:v4:'+location.pathname;
function label(id,ru,en){$(id).textContent=L(ru,en)}
function notify(ru,en){$('toast').textContent=L(ru,en);$('toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,5000)}
const undoStack=[],redoStack=[];let editGroup=null;
function snapshot(){return {slides:structuredClone(data.slides),texts:structuredClone(data.texts),media:{...data.media},language:data.language,current,idia:structuredClone(data.idia)}}
function historyButtons(){document.querySelectorAll('[data-action="undo"]').forEach(b=>b.disabled=!undoStack.length);document.querySelectorAll('[data-action="redo"]').forEach(b=>b.disabled=!redoStack.length)}
function checkpoint(group=null){const now=Date.now();if(!group||!editGroup||editGroup.key!==group||now-editGroup.time>900){undoStack.push(snapshot());if(undoStack.length>60)undoStack.shift()}editGroup=group?{key:group,time:now}:null;redoStack.length=0;historyButtons()}
function restoreHistory(from,to){if(!from.length||busy)return;const focused=document.activeElement,field=focused?.dataset?.field,caption=focused?.dataset?.caption;to.push(snapshot());const previous=from.pop();Object.assign(data,{slides:previous.slides,texts:previous.texts,media:previous.media,language:previous.language,idia:previous.idia??data.idia});current=previous.current;editGroup=null;changed();render();if(field||caption!==undefined){const el=field?document.querySelector('[data-field="'+field+'"]'):document.querySelector('[data-caption="'+caption+'"]');if(el?.isContentEditable){el.focus();const range=document.createRange();range.selectNodeContents(el);range.collapse(false);const selection=getSelection();selection.removeAllRanges();selection.addRange(range)}}}
function undo(){restoreHistory(undoStack,redoStack)}function redo(){restoreHistory(redoStack,undoStack)}
function addBlock(after=null){checkpoint();const s=data.slides[current];s.items.splice(after===null?s.items.length:after+1,0,{media:null,caption:{ru:'Новый блок',en:'New block'}});s.layout='grid';changed();render()}
function changed(){data.savedAt=Date.now();label('status','Есть изменения','Unsaved changes');clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(!db){label('status','Сохрани HTML','Save HTML to keep changes');return}try{const tx=db.transaction('docs','readwrite');tx.objectStore('docs').put(data,storageKey);tx.oncomplete=()=>label('status','Сохранено в браузере','Saved in this browser');tx.onerror=()=>label('status','Автосохранение не удалось','Autosave failed')}catch(e){label('status','Сохрани HTML','Save HTML to keep changes')}},400)}
function setText(obj,key,v){if(!obj[key]||typeof obj[key]!=='object')obj[key]={ru:obj[key]??'',en:obj[key]??''};obj[key][data.language]=v}
function src(v){return /^((?:media|concepts)\/|data:(image|video)\/)/i.test(v||'')?v:''}
function field(tag,key,value,cls=''){return `<${tag} class="${cls}" data-field="${key}" ${editing?'contenteditable="plaintext-only" spellcheck="true"':''}>${esc(value)}</${tag}>`}
function renderCard(item,i){const m=data.media[item.media];let visual;if(!m)visual=`<div class="empty"><span class="cross">＋</span><div><strong>${esc(item.caption)}</strong><small>${L('Место для референса','Reference slot')}</small></div></div>`;else if(m.type==='video')visual=`<button class="video-open" data-open-video="${i}" aria-label="${esc(item.caption)} · ${L('Открыть видео','Open video')}"><video data-preview muted loop playsinline preload="none" data-src="${esc(src(m.preview||m.src))}" ${m.poster?'poster="'+esc(src(m.poster))+'"':''} aria-hidden="true"></video><span class="video-badge" aria-hidden="true">▶</span></button>`;else visual=`<img src="${esc(src(m.src))}" alt="${esc(item.caption)}" data-zoom="${i}">`;return `<figure class="card"><div class="frame">${visual}</div><figcaption><span class="kind">${m?.type==='video'?'▶':m?'◇':'＋'}</span><span class="caption" data-caption="${i}" ${editing?'contenteditable="plaintext-only"':''}>${esc(item.caption)}</span></figcaption><div class="card-tools"><button data-action="replace" data-index="${i}">${L('Заменить','Replace')}</button><button data-action="left" data-index="${i}" ${i===0?'disabled':''}>←</button><button data-action="right" data-index="${i}" ${i===data.slides[current].items.length-1?'disabled':''}>→</button><button data-action="insert" data-index="${i}">＋ ${L('Блок после','Block after')}</button><button data-action="remove" data-index="${i}">${L('Убрать','Remove')}</button></div></figure>`}
function render(){editGroup=null;document.querySelectorAll('video').forEach(v=>v.pause());const slide=data.slides[current],group=groups.find(g=>g.id===slide.section);document.documentElement.lang=data.language;document.body.classList.toggle('editing',editing);document.body.classList.toggle('presenting',presenting);$('language').textContent=data.language==='ru'?'RU · / EN':'RU / · EN';$('language').ariaLabel=L('Переключить на английский','Switch to Russian');$('materials').innerHTML=icon+L('Материалы','Materials');label('edit',editing?'Готово':'Редактировать',editing?'Done':'Edit');label('save','Сохранить','Save');label('present',presenting?'Выйти':'Показ',presenting?'Exit':'Present');$('prev').ariaLabel=L('Предыдущий слайд','Previous slide');$('next').ariaLabel=L('Следующий слайд','Next slide');$('help').ariaLabel=L('Как пользоваться','How to use');
$('sections').innerHTML=groups.map((g,i)=>`<button data-section="${g.id}" class="${g.id===slide.section?'active':''}" aria-current="${g.id===slide.section?'page':'false'}"><span class="number">0${i+1}</span>${esc(g[data.language])}</button>`).join('');
$('main').innerHTML=`<div class="intro"><div><div class="heading-meta">${esc(group[data.language])}${slide.time?`<span class="time">${esc(slide.time)}</span>`:''}</div>${field('h1','title',slide.title,slide.id==='idea'?'latin-title':'')}</div>${field('p','text',slide.text,'description')}</div><div class="editor-tools"><button data-action="undo" ${undoStack.length?'':'disabled'} title="Ctrl+Z">↶ ${L('Отменить','Undo')}</button><button data-action="redo" ${redoStack.length?'':'disabled'} title="Ctrl+Shift+Z / Ctrl+Y">↷ ${L('Повторить','Redo')}</button><button class="primary" data-action="add">＋ ${L('Добавить блок','Add block')}</button><span class="history-hint">${L('Отмена: Ctrl+Z','Undo: Ctrl+Z')}</span></div><div class="board ${slide.id==='style'?'visual-style':''} ${slide.layout==='feature'&&slide.items.length===3?'feature':slide.layout==='pair'&&slide.items.length===2?'pair':''}">${slide.items.map(renderCard).join('')}</div><button class="add-slot" data-action="add">＋ ${L('Добавить блок','Add block')}</button><details class="notes" ${editing?'open':''}><summary>${L('Заметки для обсуждения','Discussion notes')}</summary>${field('div','notes',slide.notes,'notes-body')}</details>`;
const sectionSlides=data.slides.map((s,i)=>({s,i})).filter(x=>x.s.section===slide.section);$('pages').innerHTML=sectionSlides.map(({s,i})=>`<button data-page="${i}" class="${i===current?'active':''}">${s.time?esc(s.time.split(' — ')[0])+' · ':''}${esc(s.title)}</button>`).join('');$('count').textContent=String(current+1).padStart(2,'0')+' / '+data.slides.length;$('prev').disabled=current===0;$('next').disabled=current===data.slides.length-1;

$('help').onclick=()=>{label('help-title','Как пользоваться','How to use');$('help-content').innerHTML=L('<p><b>Три раздела:</b> идея и работы → стиль и мир → сценарий по музыке. Внизу — страницы текущего раздела и стрелки.</p><p><b>RU / EN</b> переключает язык. Ctrl+Shift+E показывает или скрывает кнопку «Редактировать». Она позволяет править заголовки, описания, заметки и подписи. Текст на двух языках редактируется отдельно, автоматического перевода новых правок нет.</p><p><b>Добавить блок</b> создаёт пустую карточку в сетке. Кликни её для выбора материала. «Блок после» вставляет карточку в нужное место. Ctrl+Z отменяет изменения; Ctrl+Shift+Z или Ctrl+Y возвращает отменённое. История — до 60 действий в текущем сеансе; после перезагрузки начинается заново.</p><p><b>Материалы</b> содержит картинки, видео и текст. Загружай файлы, выбирай их для текущего слайда. Текстовые блоки можно редактировать на обоих языках и вставлять вместо описания слайда.</p><p><b>Сохранить</b> создаёт HTML с обоими языками и добавленными файлами. Сохрани его в папку презентации рядом с <b>media</b> и <b>fonts</b>. Для передачи отправляй всю папку. Автосохранение — только в текущем браузере.</p><p>Клик по изображению открывает его крупно. Миниатюры видео воспроизводятся автоматически без звука. Нажми, чтобы открыть видео с громкостью 65%. «Показ» — полноэкранный режим, Esc — выход.</p>','<p><b>Three sections:</b> idea and previous works → style and world → scenario and music. The bottom bar lists pages in the current section and arrow controls.</p><p><b>RU / EN</b> switches languages. Ctrl+Shift+E shows or hides the Edit button. It lets you change headings, descriptions, notes and captions. Both languages are edited separately; new edits are not translated automatically.</p><p><b>Add block</b> creates an empty grid card. Click it to choose media. Block after inserts a card at that position. Ctrl+Z undoes edits; Ctrl+Shift+Z or Ctrl+Y redoes them. History keeps up to 60 actions in this session and starts over after a reload.</p><p><b>Materials</b> contains images, videos and text. Upload files and select them for the current slide. Text blocks can be edited in both languages and used to replace a slide’s description.</p><p><b>Save</b> creates HTML containing both languages and newly added files. Save it in the presentation folder beside <b>media</b> and <b>fonts</b>. Share the whole folder. Autosave works only in the current browser.</p><p>Click an image to enlarge it. Video previews play automatically without sound. Click to open a video at 65% volume. Present enters fullscreen; Esc exits.</p>');$('help-dialog').showModal()};

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.code==='KeyZ'||e.code==='KeyY')){if(['INPUT','TEXTAREA'].includes(e.target.tagName)||document.querySelector('dialog[open]:not(#idia-dialog)'))return;e.preventDefault();if(e.code==='KeyY'||e.shiftKey)redo();else undo();if($('idia-dialog').open)idiaRender();return}if(e.key==='Escape'&&presenting){exitPresent();return}if(document.querySelector('dialog[open]')||e.target.isContentEditable||['VIDEO','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
function exportedHtml(){const clone=document.documentElement.cloneNode(true);clone.querySelector('body').className='';for(const id of ['main','sections','pages','library-grid','library-tabs','zoom-content','help-content','idia-content','idia-toolbar'])clone.querySelector('#'+id).innerHTML='';clone.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));clone.querySelector('#toast').hidden=true;clone.querySelector('#save').disabled=false;clone.querySelector('#presentation-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');return '<!doctype html>\n'+clone.outerHTML}
$('save').onclick=async()=>{if(busy){notify('Дождись загрузки файлов.','Wait for the files to finish loading.');return}let handle;try{if(window.showSaveFilePicker)handle=await window.showSaveFilePicker({suggestedName:'Whisp_Tyler_Presentation.html',types:[{description:'HTML',accept:{'text/html':['.html']}}]})}catch(e){if(e.name==='AbortError')return}const button=$('save');button.disabled=true;label('save','Сохранение…','Saving…');try{data.savedAt=Date.now();const html=exportedHtml();if(handle){const w=await handle.createWritable();await w.write(html);await w.close()}else{const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Whisp_Tyler_Presentation.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}notify('HTML сохранён. Помести его рядом с папками media и fonts.','HTML saved. Keep it beside the media and fonts folders.')}catch(e){notify('Не удалось сохранить файл.','Unable to save the file.')}finally{button.disabled=false;label('save','Сохранить','Save')}};
function upgradeLore(defaults){if((data.contentUpdates||[]).includes('lore-tool-20260907'))return;const style=data.slides.find(s=>s.id==='style');if(style){const extras=data.slides.filter(s=>s.id.startsWith('mood-')).flatMap(s=>s.items);for(const item of extras)if(!item.media||!style.items.some(x=>x.media===item.media))style.items.push(item);const base=defaults.slides.find(s=>s.id==='style');for(const item of base.items)if(style.items.length<6&&!style.items.some(x=>x.media===item.media))style.items.push(structuredClone(item));style.layout='grid'}data.slides=data.slides.filter(s=>!s.id.startsWith('mood-'));for(const n of defaults.idia.nodes.filter(n=>n.id.startsWith('notion-')))if(!data.idia.nodes.some(x=>x.id===n.id))data.idia.nodes.push(structuredClone(n));for(const e of defaults.idia.links.filter(e=>e.id.startsWith('notion-')))if(!data.idia.links.some(x=>x.id===e.id))data.idia.links.push(structuredClone(e));data.contentUpdates=[...(data.contentUpdates||[]),'lore-tool-20260907']}
async function init(){try{db=await new Promise((resolve,reject)=>{const req=indexedDB.open('whisp-presentation-01',1);req.onupgradeneeded=()=>req.result.createObjectStore('docs');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});const saved=await new Promise(resolve=>{const req=db.transaction('docs').objectStore('docs').get(storageKey);req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null)});if(saved&&saved.version===4&&saved.savedAt>data.savedAt){const defaults=data;data=saved;if(!data.idia)data.idia=defaults.idia;if(!(data.contentUpdates||[]).includes('mood-20260907')){for(const [id,m] of Object.entries(defaults.media))if(id.startsWith('mood-')&&!data.media[id])data.media[id]=m;const extras=defaults.slides.filter(s=>s.id.startsWith('mood-')&&!data.slides.some(x=>x.id===s.id));const at=data.slides.findIndex(s=>s.id==='style');data.slides.splice(at<0?data.slides.length:at+1,0,...extras);if(!data.idia.nodes.some(n=>n.id==='mood-art')){data.idia.nodes.push(defaults.idia.nodes.find(n=>n.id==='mood-art'));data.idia.links.push(defaults.idia.links.find(e=>e.id==='mood-style'))}data.contentUpdates=[...(data.contentUpdates||[]),'mood-20260907']}upgradeLore(defaults)}}catch(e){}render()}
let idiaSelected='idea',idiaMode='map',idiaEditingId=null,idiaView={x:0,y:0,w:1530,h:1170},idiaDrag=null;
function idiaData(){return data.idia}
function idiaCategory(n){return n.group==='meaning'?L('Личная интерпретация','Personal interpretation'):n.group==='visual'?L('Музыка и визуал','Music and visuals'):n.group==='core'?L('Идея проекта','Project idea'):L('Лор Whisp','Whisp lore')}

function idiaRender(){const n=idiaNode();idiaSelected=n?.id??null;label('idia-subtitle','Лор, мысли и связи','Lore, thoughts and connections');$('idia-language').textContent=data.language==='ru'?'RU · / EN':'RU / · EN';$('idia-toolbar').innerHTML=`<button data-imode="map" class="${idiaMode==='map'?'active':''}">${L('Карта','Map')}</button><button data-imode="text" class="${idiaMode==='text'?'active':''}">${L('Текст','Text')}</button><button data-ia="new">＋ ${L('Мысль','Thought')}</button><button data-ia="link" ${idiaData().nodes.length<2?'disabled':''}>↔ ${L('Связь','Link')}</button><button data-ia="undo" ${undoStack.length?'':'disabled'} title="Ctrl+Z">↶</button><button data-ia="redo" ${redoStack.length?'':'disabled'} title="Ctrl+Shift+Z">↷</button><button data-ia="fit" class="spacer">${L('Вся карта','Fit map')}</button><button data-ia="save">${L('Сохранить HTML','Save HTML')}</button>`;

$('idia-content').className='idia-layout';$('idia-content').innerHTML=`<div class="idia-map"><div class="idia-help"><select id="idia-select" aria-label="${L('Выбрать мысль','Select thought')}">${idiaData().nodes.map(n=>`<option value="${esc(n.id)}" ${n.id===idiaSelected?'selected':''}>${esc(n.title)}</option>`).join('')}</select><span>${L('Нажми на узел · перетаскивай · колесо — масштаб','Select a node · drag to move · scroll to zoom')}</span></div><svg id="idia-svg" viewBox="${idiaView.x} ${idiaView.y} ${idiaView.w} ${idiaView.h}" aria-label="${L('Карта связей IDIA','IDIA connection map')}"></svg><div class="idia-legend"><span>${L('Лор','Lore')}</span><span class="meaning">${L('Интерпретация','Interpretation')}</span><span class="visual">${L('Визуал','Visuals')}</span></div></div><aside id="idia-detail" class="idia-detail"></aside>`;idiaPaint();idiaDetail();$('idia-select').onchange=e=>{idiaSelected=e.target.value;idiaPaint();idiaDetail()};const svg=$('idia-svg');svg.addEventListener('pointerdown',idiaDown);svg.addEventListener('pointermove',idiaMove);svg.addEventListener('pointerup',idiaUp);svg.addEventListener('pointercancel',idiaUp);svg.addEventListener('wheel',idiaWheel,{passive:false});svg.addEventListener('keydown',e=>{const target=e.target.closest('[data-node]');if(target&&(e.key==='Enter'||e.key===' ')){e.preventDefault();idiaSelected=target.dataset.node;idiaPaint();idiaDetail();$('idia-select').value=idiaSelected}})}
function idiaLines(title){const words=String(loc(title)).split(/\s+/),lines=[''];for(const word of words){let i=lines.length-1;if(lines[i].length+word.length>19&&lines[i]){lines.push(word)}else lines[i]+=(lines[i]?' ':'')+word}return lines}
function idiaPaint(){const svg=$('idia-svg');if(!svg)return;const g=idiaData();svg.setAttribute('viewBox',`${idiaView.x} ${idiaView.y} ${idiaView.w} ${idiaView.h}`);svg.innerHTML=g.links.map(e=>{const a=g.nodes.find(n=>n.id===e.fromId),b=g.nodes.find(n=>n.id===e.toId);if(!a||!b)return '';return `<line class="idia-edge ${e.fromId===idiaSelected||e.toId===idiaSelected?'related':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"><title>${esc(e.label)}</title></line>`}).join('')+g.nodes.map(n=>`<g class="idia-node ${n.group} ${n.id===idiaSelected?'selected':''}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.title)}" transform="translate(${n.x} ${n.y})"><circle r="${n.group==='core'?17:11}"/><text y="40">${idiaLines(n.title).map((line,i)=>`<tspan x="0" dy="${i?25:0}">${esc(line)}</tspan>`).join('')}</text></g>`).join('')}

const fearUpdate={"node": {"id": "petrified-fears", "title": {"ru": "Окаменевшие в своих страхах", "en": "Petrified in their own fears"}, "body": {"ru": "Множество людей застыли в разных позах: от страха, боли и грусти. Кто-то закрывает лицо, кто-то сжимается, отступает или склоняется под тяжестью переживаний. Это метафора людей, которые застряли и окаменели в собственных страхах.\n\nЛица не должны выглядеть как обычные реалистичные каменные портреты. Их черты скошены, перекошены и частично стёрты — намеренно неестественные, как в предоставленном референсе. Позы передают разные внутренние состояния.\n\nВ сцене первой синтезаторной мелодии Висп оказывается среди этих неподвижных людей; общие планы множества фигур чередуются с крупными планами лиц. На первом гитарном дропе лица оживают, и их зловещее притяжение втягивает Виспа во тьму.", "en": "Many people are frozen in different poses of fear, pain and sadness. Some hide their faces; others curl inward, recoil or bow under the weight of what they feel. They represent people trapped and petrified in their own fears.\n\nTheir faces should not resemble ordinary realistic stone portraits. Features are skewed, distorted and partially erased — deliberately unnatural, as in the supplied reference. Different poses express different inner states.\n\nDuring the first synth melody, Whisp finds himself among these motionless people; wide views of many figures alternate with close-ups of their faces. At the first guitar drop, the faces awaken and their sinister pull draws Whisp into darkness."}, "x": 1150, "y": 1260, "group": "meaning", "sources": []}, "links": [{"id": "petrified-inner", "fromId": "petrified-fears", "toId": "inner", "label": {"ru": "метафора внутреннего плена", "en": "metaphor for inner captivity"}}, {"id": "petrified-demons", "fromId": "petrified-fears", "toId": "demons", "label": {"ru": "страхи и слабости", "en": "fears and weaknesses"}}, {"id": "petrified-fall", "fromId": "petrified-fears", "toId": "fall", "label": {"ru": "ожившие лица втягивают во тьму", "en": "awakened faces draw him into darkness"}}, {"id": "petrified-sequence", "fromId": "petrified-fears", "toId": "sequence", "label": {"ru": "синтезаторная мелодия → первый дроп", "en": "synth melody → first drop"}}], "media": {"fear-concept": {"id": "fear-concept", "type": "image", "src": "concepts/concept-07-trapped-in-fear-v1.png", "filename": "concept-07-trapped-in-fear-v1.png", "title": {"ru": "Окаменевшие в страхах · концепт", "en": "Petrified in fear · concept"}}, "fear-reference": {"id": "fear-reference", "type": "image", "src": "concepts/reference-skewed-face.png", "filename": "reference-skewed-face.png", "title": {"ru": "Скошенное лицо · референс автора", "en": "Skewed face · artist’s reference"}}}};

const flightToFightUpdate = {"node": {"id": "flight-to-fight", "title": {"ru": "От бегства к борьбе", "en": "From flight to confrontation"}, "body": {"ru": "Вначале Висп убегает от кошмара, страха, Anti и демонов. Но со временем ему надоедает бежать. Он перестаёт отступать: остаётся только сражаться с тем, от чего прежде пытался скрыться.\n\nЭто поворот от бегства к осознанному противостоянию в общей истории Виспа.\n\nПоследовательность: бегство → отказ убегать → борьба. Точное место поворота в музыкальном сценарии пока не определено.", "en": "At first, Whisp runs from the nightmare, fear, Anti, and the demons. Eventually, he grows tired of running. He stops retreating: all that remains is to fight what he once tried to escape.\n\nThis marks the shift from flight to deliberate confrontation in Whisp’s wider story.\n\nSequence: flight → refusal to keep running → confrontation. The turning point’s precise placement within the music video remains undecided."}, "x": 710, "y": 1100, "group": "meaning", "sources": [{"title": "Whisp Lore", "url": "https://www.notion.so/db4dc7a9aeaf4173a6c8452d7cce775a"}]}, "links": [{"id": "flight-to-fight-whisp", "fromId": "flight-to-fight", "toId": "whisp", "label": {"ru": "поворот в пути персонажа", "en": "turning point in his journey"}}, {"id": "flight-to-fight-demons", "fromId": "flight-to-fight", "toId": "demons", "label": {"ru": "от преследования к противостоянию", "en": "from pursuit to confrontation"}}, {"id": "flight-to-fight-inner", "fromId": "flight-to-fight", "toId": "inner", "label": {"ru": "борьба с собственными страхами", "en": "facing his own fears"}}, {"id": "flight-to-fight-sequence", "fromId": "flight-to-fight", "toId": "sequence", "label": {"ru": "бегство → решение сражаться", "en": "flight → decision to fight"}}, {"id": "flight-to-fight-notion-origin", "fromId": "flight-to-fight", "toId": "notion-origin", "label": {"ru": "часть общего лора Whisp", "en": "part of the wider Whisp lore"}}]};

function mergeSelectedOpening(doc) {
 const marker='selected-opening-20260907';
 if((doc.contentUpdates||[]).includes(marker))return false;
 for(const m of selectedOpeningMedia)if(!doc.media[m.id])doc.media[m.id]=structuredClone(m);
 const oldCaptions={opening:['Ландшафты и ядерная зима','Общие планы руин'],locations:['Панорамы руин','Снег, туман и масштаб']};
 for(const id of ['opening','locations']){
  const slide=doc.slides.find(s=>s.id===id);if(!slide)continue;
  const kept=slide.items.filter(item=>!(item.media==null && oldCaptions[id].includes(item.caption?.ru)));
  const missing=selectedOpeningMedia.filter(m=>!kept.some(item=>item.media===m.id)).map(m=>({media:m.id,caption:structuredClone(m.title)}));
  slide.items=[...missing,...kept];
  if(id==='locations'){
   for(const lang of ['ru','en']){
    const stale=lang==='ru'?' Новые изображения пока не генерируем.':' New images are not being generated yet.';
    if(typeof slide.notes?.[lang]==='string')slide.notes[lang]=slide.notes[lang].replace(stale,'');
   }
  }
 }
 doc.contentUpdates=[...(doc.contentUpdates||[]),marker];return true;
}

init=async function(){await initBeforeSelectedOpening();if(mergeSelectedOpening(data)){changed();render()}};
